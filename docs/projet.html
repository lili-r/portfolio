<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projet Julie Ramier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400&family=Inter:wght@400;500&display=swap">
<style>
/* Page projet : même conteneur 12 colonnes que l'accueil. Label de section (col. 1–3) + contenu (col. 4–12). */
@view-transition { navigation: auto; }
:root {
  --night: #0f0f0e; --slate: #191917; --rule: #2a2926; --chalk: #ecebe6; --haze: #8f8b83;
  --sage: #8c9d78; --blush: #e7b9b6; --ember: #e0532b; --bone: #dcd8cf;
  --f-display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --container: 1280px; --gap: clamp(16px, 2vw, 32px); --section: clamp(96px, 11vw, 168px);
  --out: cubic-bezier(.16,1,.3,1); --back: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--chalk); }
body { margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 300; font-family: var(--f-display); }
p { text-wrap: pretty; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; }
.dim { color: var(--haze); }
[hidden] { display: none !important; }

.c { max-width: var(--container); margin-inline: auto; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); }
.c > * { min-width: 0; }

/* Navigation */
.nav { padding-block: 28px; align-items: center; position: sticky; top: 0; z-index: 10; background: linear-gradient(var(--night) 60%, transparent); }
.nav .brand { grid-column: 1 / 4; font-size: 14px; text-decoration: none; }
.nav ul { grid-column: 4 / 13; display: flex; justify-content: flex-end; gap: clamp(16px, 3vw, 40px); list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--haze); }
.nav ul a { text-decoration: none; transition: color .2s; } .nav ul a:hover { color: var(--chalk); }

/* Boutons */
.cta { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; border: 1px solid var(--chalk); border-radius: 999px; padding: 13px 22px; font-size: 14px; text-decoration: none; cursor: pointer; background: transparent; transition: background .25s, color .25s, border-color .25s; }
.cta:hover { background: var(--chalk); color: var(--night); }
.cta.solid { background: var(--chalk); color: var(--night); }
.mag { position: relative; overflow: hidden; isolation: isolate; transition: translate .8s var(--back), background .3s, color .3s; }
.mag::before { content: ""; position: absolute; z-index: -1; left: var(--fx, 50%); top: var(--fy, 50%); width: 240%; aspect-ratio: 1; translate: -50% -50%; scale: 0; border-radius: 50%; background: var(--blush); transition: scale .6s var(--out); }
.mag:hover::before, .mag:focus-visible::before { scale: 1; }
.mag:hover { border-color: var(--blush); color: var(--night); }
.mag .lbl { display: inline-block; transition: translate .8s var(--back); }

/* En-tête du projet */
.back { grid-column: 1 / -1; justify-self: start; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--haze); text-decoration: none; padding: 6px 0; transition: color .2s, gap .3s var(--out); }
.back:hover { color: var(--chalk); gap: 12px; }
.p-head { padding-block: clamp(24px, 4vw, 56px) clamp(40px, 5vw, 72px); row-gap: 28px; }
.p-label { grid-column: 1 / 4; display: grid; gap: 4px; align-content: start; padding-top: 14px; }
.p-label .num, .slabel { font-family: var(--f-display); font-weight: 300; font-size: 22px; letter-spacing: -.02em; }
.p-label .num { color: var(--haze); font-variant-numeric: tabular-nums; }
.p-label .disc { color: var(--haze); font-size: 14px; max-width: 22ch; }
.p-title { grid-column: 4 / 13; display: grid; gap: 28px; }
.p-title h1 { font-size: clamp(44px, 6.6vw, 104px); letter-spacing: -.055em; line-height: .92; max-width: 15ch; }
.p-title .sum { font-size: clamp(18px, 1.6vw, 22px); line-height: 1.45; max-width: 46ch; }

/* Sélecteur Essentiel / En profondeur */
.modes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.seg { display: inline-flex; padding: 4px; border: 1px solid var(--rule); border-radius: 999px; position: relative; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 9px 18px; border-radius: 999px; font-size: 14px; color: var(--haze); cursor: pointer; transition: color .3s; }
.seg button[aria-pressed="true"] { color: var(--night); }
.seg .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--chalk); transition: translate .5s var(--out), width .5s var(--out); }
.modes .hint { font-size: 14px; color: var(--haze); }

/* Visuel principal */
.hero-vis { grid-column: 1 / -1; aspect-ratio: 16 / 8; border-radius: 18px; overflow: hidden; background: var(--slate); view-transition-name: projet-visuel; }
.hero-vis img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-vis.contain img { object-fit: contain; padding: 8%; }
.hero-vis.light { background: #fff; }

/* Fiche technique */
.fiche { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 24px var(--gap); margin: clamp(32px, 4vw, 56px) 0 0; padding-top: 24px; border-top: 1px solid var(--rule); }
.fiche div { display: grid; gap: 6px; align-content: start; }
.fiche dt { font-size: 13px; color: var(--haze); }
.fiche dd { margin: 0; font-size: 15px; line-height: 1.5; }

/* Sections */
.sec { padding-top: var(--section); }
.sec .s-label { grid-column: 1 / 4; padding-top: 8px; }
.sec .s-body { grid-column: 4 / 13; display: grid; gap: 28px; align-content: start; }
.sec h2 { font-size: clamp(32px, 4vw, 58px); letter-spacing: -.045em; line-height: 1.02; max-width: 20ch; }
.sec .lead { font-size: clamp(17px, 1.4vw, 20px); line-height: 1.6; max-width: 58ch; color: var(--bone); }
.sec .lead + .lead { margin-top: -8px; }
.deep[hidden] { display: none; }
.deep.enter { animation: rise .9s var(--out) both; }
@keyframes rise { from { opacity: 0; translate: 0 24px; } }

.bul { list-style: none; margin: 0; padding: 0; display: grid; max-width: 64ch; }
.bul li { padding: 16px 0 16px 28px; border-top: 1px solid var(--rule); position: relative; color: var(--bone); }
.bul li:last-child { border-bottom: 1px solid var(--rule); }
.bul li::before { content: ""; position: absolute; left: 2px; top: 27px; width: 8px; height: 8px; border-radius: 50%; background: var(--blush); }

.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.step { border-top: 1px solid var(--rule); padding-top: 20px; display: grid; gap: 10px; align-content: start; }
.step .n { font-family: var(--f-display); font-weight: 300; font-size: 22px; color: var(--haze); font-variant-numeric: tabular-nums; }
.step h3 { font-size: clamp(22px, 2vw, 28px); letter-spacing: -.03em; line-height: 1.15; }
.step p { color: var(--haze); max-width: 46ch; }
.step p strong, .bul strong { color: var(--chalk); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
.stats div { border-top: 1px solid var(--rule); padding-top: 18px; display: grid; gap: 6px; align-content: start; }
.stats b { font-family: var(--f-display); font-weight: 200; font-size: clamp(44px, 5vw, 76px); letter-spacing: -.055em; line-height: .9; font-variant-numeric: tabular-nums; }
.stats span { color: var(--haze); font-size: 14px; }

/* Galerie des réalisations */
/* Planche : vue d'ensemble des visuels, en petit, cliquables */
.planche { grid-column: 4 / 13; columns: 3 220px; column-gap: 20px; margin-top: clamp(32px, 4vw, 48px); }
.planche figure { break-inside: avoid; margin: 0 0 28px; display: grid; gap: 10px; }
.planche .tile { display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: zoom-in; background: var(--slate); aspect-ratio: var(--ar, 4 / 3); position: relative; }
.planche .tile.light { background: #fff; }
.planche .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: scale .8s var(--out), opacity .4s; }
.planche .tile.contain img { object-fit: contain; }
.planche .tile::after { content: "+"; position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--chalk); color: var(--night); display: grid; place-items: center; font-size: 18px; line-height: 1; opacity: 0; translate: 0 6px; transition: opacity .3s, translate .4s var(--out); }
.planche .tile:hover img { scale: 1.03; }
.planche .tile:hover::after, .planche .tile:focus-visible::after { opacity: 1; translate: 0 0; }
.planche figcaption { font-size: 13px; color: var(--haze); line-height: 1.4; }
.planche .todo-tile { aspect-ratio: var(--ar, 4 / 3); border-radius: 10px; border: 1px dashed #4a4844; display: grid; place-items: center; align-content: center; gap: 8px; text-align: center; padding: 16px; font-size: 13px; color: var(--haze); }
.planche.sys { columns: 1; }
.planche.two { columns: 2 260px; }
.planche.sys figure { max-width: 100%; }
.film { grid-column: 4 / 13; margin: clamp(32px, 4vw, 48px) 0 0; display: grid; gap: 10px; }
.film .todo-fr { aspect-ratio: 16 / 9; border-radius: 14px; border: 1px dashed #4a4844; display: grid; place-items: center; align-content: center; text-align: center; color: var(--haze); font-size: 14px; }
.film .fr { border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; position: relative; background: #000; }
.film video { width: 100%; height: 100%; object-fit: cover; display: block; }
.film figcaption { font-size: 13px; color: var(--haze); }
.film .snd { position: absolute; left: 16px; bottom: 16px; border: 1px solid rgba(255,255,255,.35); background: rgba(15,15,14,.6); backdrop-filter: blur(8px); color: var(--chalk); border-radius: 999px; padding: 9px 16px; font-size: 13px; cursor: pointer; transition: background .25s, color .25s; }
.film .snd:hover, .film .snd[aria-pressed="true"] { background: var(--chalk); color: var(--night); }
/* Visionneuse */
#lb { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; width: 100vw; height: 100dvh; color: var(--chalk); }
#lb::backdrop { background: rgba(8,8,7,.92); backdrop-filter: blur(6px); }
#lb .in-lb { width: 100%; height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 64px clamp(16px, 6vw, 96px) 24px; gap: 16px; }
#lb .stage { position: relative; min-height: 0; }
#lb .stage img { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; display: block; }
#lb .stage img.light { background: #fff; }
#lb .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 14px; color: var(--haze); }
#lb .bar .cap { color: var(--chalk); }
#lb button { border: 1px solid var(--rule); background: rgba(25,25,23,.8); color: var(--chalk); border-radius: 999px; height: 44px; min-width: 44px; padding: 0 16px; cursor: pointer; font-size: 15px; }
#lb button:hover { background: var(--chalk); color: var(--night); }
#lb .x { position: absolute; top: 14px; right: 16px; }
#lb .nav2 { display: flex; gap: 8px; }
.gallery { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: clamp(32px, 4vw, 56px); }
.gallery figure { margin: 0; display: grid; gap: 12px; align-content: start; }
.gallery .fr { border-radius: 14px; overflow: hidden; background: var(--slate); aspect-ratio: var(--ar, 4 / 3); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: scale .9s var(--out); }
.gallery .fr.contain img { object-fit: contain; padding: 8%; }
.gallery .fr.light { background: #fff; }
.gallery figure:hover img { scale: 1.02; }
.gallery .vid { position: relative; background: #000; }
.gallery .vid video { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery .snd { position: absolute; left: 16px; bottom: 16px; border: 1px solid rgba(255,255,255,.35); background: rgba(15,15,14,.6); backdrop-filter: blur(8px); color: var(--chalk); border-radius: 999px; padding: 9px 16px; font-size: 13px; cursor: pointer; transition: background .25s, color .25s; }
.gallery .snd:hover, .gallery .snd[aria-pressed="true"] { background: var(--chalk); color: var(--night); }
.gallery figcaption { font-size: 13px; color: var(--haze); }
.gallery .w12 { grid-column: span 12; } .gallery .w7 { grid-column: span 7; } .gallery .w5 { grid-column: span 5; } .gallery .w6 { grid-column: span 6; } .gallery .w4 { grid-column: span 4; } .gallery .w8 { grid-column: span 8; }
.gallery .todo-fr { border: 1px dashed #4a4844; background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,.015) 14px 28px); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--haze); font-size: 14px; }

/* Ce dont je suis le plus fière */
/* Équipe */
.team .s-body { gap: 24px; }
.people { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.person { display: grid; grid-template-columns: 72px minmax(0, 1fr) 36px; align-items: center; gap: 16px; padding: 12px 16px 12px 12px; border: 1px solid var(--rule); border-radius: 999px; text-decoration: none; transition: border-color .3s, background .3s; }
.person:hover { border-color: var(--blush); background: var(--slate); }
.person img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: block; filter: grayscale(1); }
.person b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: -.01em; }
.person span span { font-size: 13px; color: var(--haze); line-height: 1.4; }
.person .li { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--chalk); color: var(--night); font-weight: 600; font-size: 14px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* Focus charte */
.focus .s-body { gap: 28px; }
.focus .slabel { color: var(--blush); }
.flow { display: grid; gap: 16px; padding-top: 8px; }
.flow .from { font-family: var(--f-display); font-weight: 300; font-size: clamp(20px, 1.8vw, 26px); letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { font-size: 14px; border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; color: var(--bone); }
.chips span:first-child { background: var(--blush); border-color: var(--blush); color: var(--night); }
.flow a { justify-self: start; font-size: 14px; color: var(--haze); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 5px; }
.flow a:hover { color: var(--chalk); text-decoration-color: var(--blush); }

/* Process vidéo (étapes cliquables) */
.proc { grid-column: 4 / 13; display: grid; gap: 24px; margin-top: clamp(32px, 4vw, 48px); }
.steps-nav { display: grid; grid-template-columns: repeat(var(--k), minmax(0, 1fr)); position: relative; list-style: none; margin: 0; padding: 0; }
.steps-nav::before { content: ""; position: absolute; left: 0; right: 0; top: 17px; height: 1px; background: var(--rule); }
.steps-nav button { position: relative; display: grid; justify-items: start; gap: 10px; background: none; border: 0; padding: 0 8px 0 0; cursor: pointer; text-align: left; color: var(--haze); font-size: 13px; line-height: 1.3; }
.steps-nav .dot { width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--rule); background: var(--night); font-family: var(--f-display); font-size: 14px; font-variant-numeric: tabular-nums; transition: background .3s, color .3s, border-color .3s; }
.steps-nav button[aria-selected="true"] { color: var(--chalk); }
.steps-nav button[aria-selected="true"] .dot { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.steps-nav button:hover .dot { border-color: var(--blush); }
.panel { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--gap); align-items: start; }
.panel .vis { border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--slate); }
.panel .vis img { width: 100%; height: 100%; object-fit: cover; display: block; }
.panel .vis.todo-tile { border: 1px dashed #4a4844; background: none; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--haze); font-size: 14px; text-align: center; padding: 16px; }
.panel .vis.script { aspect-ratio: auto; max-height: 460px; overflow: auto; background: #f3f0e8; color: #1d1c1a; padding: clamp(20px, 3vw, 36px); font-family: "Courier Prime", "Courier New", Courier, monospace; font-size: 14px; line-height: 1.55; display: grid; gap: 12px; align-content: start; border-radius: 14px; }
.script .sh { font-weight: 700; letter-spacing: .04em; }
.script .act { color: #4a4844; }
.script .who2 { text-align: center; font-weight: 700; margin-top: 6px; }
.script .line { text-align: center; max-width: 34ch; justify-self: center; }
.play { justify-self: start; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--chalk); background: var(--chalk); color: var(--night); border-radius: 999px; padding: 11px 18px; font-size: 14px; cursor: pointer; transition: background .25s, border-color .25s; }
.play:hover { background: var(--blush); border-color: var(--blush); }
.play svg { width: 12px; height: 12px; }
.panel .vis video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
.proc { list-style: none; padding: 0; counter-reset: none; }
.pstep { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: var(--gap); align-items: start; border-top: 1px solid var(--rule); padding-top: 24px; }
.pstep + .pstep { margin-top: clamp(28px, 3.5vw, 48px); }
.ptxt { display: grid; gap: 10px; align-content: start; }
.ptxt .n { font-family: var(--f-display); font-weight: 300; font-size: 22px; color: var(--haze); font-variant-numeric: tabular-nums; }
.ptxt h3 { font-size: clamp(22px, 2vw, 28px); letter-spacing: -.03em; line-height: 1.15; }
.ptxt p { color: var(--bone); max-width: 42ch; }
.pstep .vis { border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--slate); }
.pstep .vis img, .pstep .vis video { width: 100%; height: 100%; object-fit: cover; display: block; }
.pstep .vis.todo-tile { border: 1px dashed #4a4844; background: none; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--haze); font-size: 14px; text-align: center; padding: 16px; }
.strip { grid-column: 4 / 13; list-style: none; margin: clamp(28px, 3.5vw, 44px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }
.stile { all: unset; cursor: pointer; display: grid; gap: 10px; width: 100%; }
.stile .sv { aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--slate); display: grid; place-items: center; border: 1px solid var(--rule); transition: border-color .3s; }
.stile .sv img { width: 100%; height: 100%; object-fit: cover; display: block; transition: scale .8s var(--out); }
.stile .sdoc { font-family: var(--f-display); font-size: 15px; color: var(--haze); padding: 10px; text-align: center; }
.stile .sdoc.vg { width: 100%; height: 100%; display: grid; place-items: center; padding: 0; background: radial-gradient(70% 90% at 85% 10%, #f0b4a4, transparent 60%), radial-gradient(80% 90% at 10% 40%, #a98bc9, transparent 65%), linear-gradient(160deg, #6d5a8f, #2b2638); }
.stile .sdoc.vg svg { width: 56%; height: 56%; }
.vdir { margin: 6px 0 0; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; background: var(--slate); max-width: 46ch; }
.vdir figcaption { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--haze); }
.vdir p { margin: 0; color: var(--chalk); font-size: 14.5px; line-height: 1.9; }
.vdir .tag { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 1px 8px; border-radius: 99px; background: rgba(231,185,182,.14); color: var(--blush); border: 1px solid rgba(231,185,182,.3); margin: 0 2px; vertical-align: 1px; }
.stile .sl { font-size: 13px; color: var(--bone); line-height: 1.35; display: grid; gap: 2px; }
.stile .sl b { font-family: var(--f-display); font-weight: 300; color: var(--haze); font-size: 13px; }
.stile:hover .sv, .stile:focus-visible .sv { border-color: var(--blush); }
.stile:hover .sv img { scale: 1.04; }
.stile:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; border-radius: 10px; }
/* Carte voix */
.pstep .vis.voice { aspect-ratio: 16 / 10; position: relative; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto auto; padding: 18px 20px 16px; gap: 8px;
  background: radial-gradient(70% 90% at 85% 10%, #f0b4a4 0%, transparent 60%), radial-gradient(80% 90% at 10% 40%, #a98bc9 0%, transparent 65%), linear-gradient(160deg, #6d5a8f, #2b2638 70%, #1b1a20); color: #fff; }
.voice .vhead { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 15px; letter-spacing: -.01em; }
.voice .vhead svg { width: 18px; height: 18px; }
.voice canvas { width: 100%; height: 100%; min-height: 0; display: block; }

  <footer class="c foot"><span>© 2026 Julie Ramier · Paris</span><span>Mentions légales</span></footer>`;
  wire();
}

/* Mode de lecture : mémorisé, partageable avec ?lecture=profondeur */
const store = { get: () => { try { return localStorage.getItem("lecture"); } catch { return null; } }, set: v => { try { localStorage.setItem("lecture", v); } catch {} } };
let mode = new URLSearchParams(location.search).get("lecture") === "profondeur" ? "profondeur" : (store.get() || "essentiel");
function setMode(m, animate) {
  mode = m; store.set(m);
  const deep = m === "profondeur";
  document.querySelectorAll("[data-deep]").forEach(s => { s.hidden = !deep; s.classList.toggle("enter", deep && animate); });
  document.querySelectorAll("[data-ess]").forEach(s => { s.hidden = deep; });
  document.getElementById("invite").hidden = deep;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  const extra = [...new Set([...document.querySelectorAll("section[data-deep]")].map(x => x.getAttribute("aria-label")))];
  document.getElementById("mode-hint").textContent = deep ? "Toute la démarche, étape par étape." : `L'essentiel en 1 minute. En profondeur : ${extra.length} sections en plus (${extra.slice(0, 3).join(", ").toLowerCase()}${extra.length > 3 ? "…" : ""}).`;
  const on = document.querySelector(`.seg button[data-mode="${m}"]`), pill = document.querySelector(".seg .pill");
  pill.style.width = on.offsetWidth + "px"; pill.style.translate = on.offsetLeft + "px 0";
}
function lightbox() {
  let dlg = document.getElementById("lb");
  if (!dlg) { document.body.insertAdjacentHTML("beforeend", `<dialog id="lb" aria-label="Visionneuse"><div class="in-lb"><button class="x" type="button" aria-label="Fermer">×</button><div class="stage"><img alt=""></div><div class="bar"><span><span class="cap"></span> <span class="cnt"></span></span><span class="nav2"><button type="button" class="pv" aria-label="Visuel précédent">←</button><button type="button" class="nx" aria-label="Visuel suivant">→</button></span></div></div></dialog>`); dlg = document.getElementById("lb");
    dlg.querySelector(".x").onclick = () => dlg.close();
    dlg.addEventListener("click", e => { if (e.target === dlg || e.target.classList.contains("stage")) dlg.close(); });
    dlg.querySelector(".pv").onclick = () => show(dlg._i - 1);
    dlg.querySelector(".nx").onclick = () => show(dlg._i + 1);
    dlg.addEventListener("keydown", e => { if (e.key === "ArrowLeft") show(dlg._i - 1); if (e.key === "ArrowRight") show(dlg._i + 1); });
  }
  function show(i) { i = (i + LB.length) % LB.length; dlg._i = i; const g = LB[i], im = dlg.querySelector("img");
    im.src = A + g.src; im.alt = g.alt; im.className = g.light ? "light" : ""; dlg.querySelector(".cap").textContent = g.cap || ""; dlg.querySelector(".cnt").textContent = ` · ${i + 1} / ${LB.length}`; }
  document.querySelectorAll("[data-lb]").forEach(b => b.addEventListener("click", () => { show(+b.dataset.lb); dlg.showModal(); }));
}
function wireVideos() {
  document.querySelectorAll(".vid").forEach(box => {
    const v = box.querySelector("video"), b = box.querySelector(".snd");
    const fail = () => { box.outerHTML = `<div class="fr todo-fr" style="--ar:16 / 9">Vidéo d'introduction<br><span class="todo" style="margin-top:8px">Fichier à renvoyer</span></div>`; };
    if (v.error) return fail();
    v.addEventListener("error", fail);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { v.removeAttribute("autoplay"); v.pause(); }
    else if ("IntersectionObserver" in window) new IntersectionObserver(([e]) => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }, { threshold: .3 }).observe(v);
    b.addEventListener("click", () => { v.muted = !v.muted; if (!v.muted) v.play(); b.setAttribute("aria-pressed", String(!v.muted)); b.textContent = v.muted ? "Activer le son" : "Couper le son"; });
  });
}
function wireVoice(card) {
  const au = card.querySelector("audio"), cv = card.querySelector("canvas"), btn = card.querySelector(".vplay"),
        bar = card.querySelector(".vprog"), fill = bar.querySelector("i"), tm = card.querySelector(".vtime"), lines = [...card.querySelectorAll(".vtext p")];
  const g = cv.getContext("2d"); let ctx, an, data, raf, t0 = performance.now();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const icon = p => btn.innerHTML = p ? '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>' : '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>';
  const setLine = t => { let k = -1; lines.forEach((l, i) => { if (t >= +l.dataset.t) k = i; }); lines.forEach((l, i) => l.classList.toggle("on", i === Math.max(0, k))); };
  setLine(0);
  function draw(now) {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
    const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .26, N = 96;
    g.clearRect(0, 0, W, H);
    if (an && !au.paused) an.getByteFrequencyData(data);
    const tt = (now - t0) / 1000;
    g.strokeStyle = "rgba(255,255,255,.92)"; g.lineWidth = Math.max(1.2, 1.4 * dpr); g.lineCap = "round";
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2 - Math.PI / 2;
      let v;
      if (an && !au.paused) { const k = Math.floor((i < N / 2 ? i : N - i) / (N / 2) * data.length * .6); v = Math.min(1, data[k] / 255 * 1.5); }
      else v = reduce ? .08 : .06 + .05 * Math.sin(tt * 1.6 + i * .35) * Math.sin(tt * .7 + i * .11);
      const L = R * (.06 + v * .9);
      g.beginPath(); g.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.lineTo(cx + Math.cos(a) * (R + L), cy + Math.sin(a) * (R + L)); g.stroke();
    }
    const grd = g.createRadialGradient(cx, cy - R * .3, R * .1, cx, cy, R);
    grd.addColorStop(0, "rgba(255,255,255,.18)"); grd.addColorStop(1, "rgba(255,255,255,.04)");
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, R * .94, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(cx, cy, R * .94, 0, Math.PI * 2); g.stroke();
    raf = requestAnimationFrame(draw);
  }
  raf = requestAnimationFrame(draw);
  btn.addEventListener("click", () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); const src = ctx.createMediaElementSource(au); an = ctx.createAnalyser(); an.fftSize = 256; data = new Uint8Array(an.frequencyBinCount); src.connect(an); an.connect(ctx.destination); } catch (e) { an = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    if (au.paused) au.play().catch(() => {}); else au.pause();
  });
  au.addEventListener("play", () => { icon(true); btn.setAttribute("aria-label", "Mettre en pause"); });
  au.addEventListener("pause", () => { icon(false); btn.setAttribute("aria-label", "Écouter"); });
  au.addEventListener("timeupdate", () => { const p = au.duration ? au.currentTime / au.duration * 100 : 0; fill.style.width = p + "%"; bar.setAttribute("aria-valuenow", Math.round(p)); tm.textContent = fmt(au.currentTime); setLine(au.currentTime); });
  au.addEventListener("ended", () => { au.currentTime = 0; setLine(0); });
  bar.addEventListener("click", e => { const r = bar.getBoundingClientRect(); if (au.duration) au.currentTime = (e.clientX - r.left) / r.width * au.duration; });
}
function wireProc() {
  document.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => { setMode("profondeur", true); const t = document.getElementById("etape-" + b.dataset.goto); requestAnimationFrame(() => t && t.scrollIntoView({ behavior: "smooth", block: "start" })); }));
  document.querySelectorAll("[data-deepen]").forEach(b => b.addEventListener("click", () => { setMode("profondeur", true); const t = document.getElementById("etape-0"); requestAnimationFrame(() => t && t.scrollIntoView({ behavior: "smooth", block: "start" })); }));
  document.querySelectorAll("[data-voice]").forEach(wireVoice);
  const box = document.querySelector("[data-proc]"); if (!box || !PROC) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  box.querySelectorAll("video[data-clip]").forEach(v => {
    const [start, end] = v.dataset.clip.split(",").map(Number);
    v.addEventListener("loadedmetadata", () => { v.currentTime = start; });
    v.addEventListener("timeupdate", () => { if (end && v.currentTime >= end) v.currentTime = start; });
    if (!reduce && "IntersectionObserver" in window) new IntersectionObserver(([e]) => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }, { threshold: .4 }).observe(v);
  });
  box.querySelectorAll("[data-listen]").forEach(btn => btn.addEventListener("click", () => {
    const li = btn.closest(".pstep"), st = PROC.steps[+li.dataset.i], L = st.listen, vis = li.querySelector(".vis");
    vis.className = "vis"; vis.removeAttribute("tabindex");
    vis.innerHTML = `<video src="${A}${L.src}" poster="${A}${L.poster}" playsinline controls aria-label="${L.label}"></video>`;
    const vv = vis.querySelector("video");
    vv.addEventListener("loadedmetadata", () => { vv.currentTime = L.start || 0; vv.play().catch(() => {}); }, { once: true });
    vv.addEventListener("timeupdate", () => { if (L.end && vv.currentTime >= L.end) vv.pause(); });
    btn.hidden = true;
  }));
}
function wire() {
  wireVideos();
  wireProc();
  document.querySelectorAll("[data-scroll]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById("realisations").scrollIntoView({ behavior: "smooth" }); }));
  lightbox();
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode, true)));
  document.getElementById("go-deep").addEventListener("click", () => { const y = scrollY; setMode("profondeur", true); scrollTo({ top: y }); document.querySelector("[data-deep]")?.scrollIntoView({ behavior: "smooth", block: "start" }); });
  setMode(mode, false);
  const btn = document.getElementById("end-cta"), lbl = btn.querySelector(".lbl"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  btn.addEventListener("pointermove", e => { const r = btn.getBoundingClientRect();
    btn.style.setProperty("--fx", `${e.clientX - r.left}px`); btn.style.setProperty("--fy", `${e.clientY - r.top}px`);
    if (reduce) return; const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    btn.style.translate = `${dx * .18}px ${dy * .3}px`; lbl.style.translate = `${dx * .08}px ${dy * .12}px`; });
  btn.addEventListener("pointerleave", () => { btn.style.translate = "0 0"; lbl.style.translate = "0 0"; });
}

/* Retour à l'accueil : l'adresse de l'accueil est notée au clic sur un projet */
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-home]"); if (!a) return;
  const hash = a.getAttribute("href").split("#")[1];
  let home = null;
  try { home = sessionStorage.getItem("home"); } catch {}
  if (!home) try { const ref = document.referrer && new URL(document.referrer); if (ref && ref.origin === location.origin && !/projet\.html/.test(ref.pathname)) home = ref.pathname + ref.search; } catch {}
  if (home) { e.preventDefault(); location.href = home + (hash ? "#" + hash : ""); }
});

const go = () => { const id = location.hash.slice(1); render(id); scrollTo({ top: 0 }); };
addEventListener("hashchange", () => document.startViewTransition ? document.startViewTransition(go) : go());
render(location.hash.slice(1));
</script>
