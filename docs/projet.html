<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projet Julie Ramier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400&family=Inter:wght@400;500&display=swap">
<style>
/* Page projet : même conteneur 12 colonnes que l'accueil. Label de section (col. 1–3) + contenu (col. 4–12). */
@view-transition { navigation: auto; }
:root {
  --night: #0f0f0e; --slate: #191917; --rule: #2a2926; --chalk: #ecebe6; --haze: #8f8b83;
  --sage: #8c9d78; --blush: #e7b9b6; --ember: #e0532b; --bone: #dcd8cf;
  --f-display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --container: 1280px; --gap: clamp(16px, 2vw, 32px); --section: clamp(96px, 11vw, 168px);
  --out: cubic-bezier(.16,1,.3,1); --back: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--chalk); }
body { margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 300; font-family: var(--f-display); }
p { text-wrap: pretty; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; }
.dim { color: var(--haze); }
[hidden] { display: none !important; }

.c { max-width: var(--container); margin-inline: auto; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); }
.c > * { min-width: 0; }

/* Navigation */
.nav { padding-block: 28px; align-items: center; position: sticky; top: 0; z-index: 10; background: linear-gradient(var(--night) 60%, transparent); }
.nav .brand { grid-column: 1 / 4; font-size: 14px; text-decoration: none; }
.nav ul { grid-column: 4 / 13; display: flex; justify-content: flex-end; gap: clamp(16px, 3vw, 40px); list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--haze); }
.nav ul a { text-decoration: none; transition: color .2s; } .nav ul a:hover { color: var(--chalk); }

/* Boutons */
.cta { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; border: 1px solid var(--chalk); border-radius: 999px; padding: 13px 22px; font-size: 14px; text-decoration: none; cursor: pointer; background: transparent; transition: background .25s, color .25s, border-color .25s; }
.cta:hover { background: var(--chalk); color: var(--night); }
.cta.solid { background: var(--chalk); color: var(--night); }
.mag { position: relative; overflow: hidden; isolation: isolate; transition: translate .8s var(--back), background .3s, color .3s; }
.mag::before { content: ""; position: absolute; z-index: -1; left: var(--fx, 50%); top: var(--fy, 50%); width: 240%; aspect-ratio: 1; translate: -50% -50%; scale: 0; border-radius: 50%; background: var(--blush); transition: scale .6s var(--out); }
.mag:hover::before, .mag:focus-visible::before { scale: 1; }
.mag:hover { border-color: var(--blush); color: var(--night); }
.mag .lbl { display: inline-block; transition: translate .8s var(--back); }

/* En-tête du projet */
.back { grid-column: 1 / -1; justify-self: start; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--haze); text-decoration: none; padding: 6px 0; transition: color .2s, gap .3s var(--out); }
.back:hover { color: var(--chalk); gap: 12px; }
.p-head { padding-block: clamp(24px, 4vw, 56px) clamp(40px, 5vw, 72px); row-gap: 28px; }
.p-label { grid-column: 1 / 4; display: grid; gap: 4px; align-content: start; padding-top: 14px; }
.p-label .num, .slabel { font-family: var(--f-display); font-weight: 300; font-size: 22px; letter-spacing: -.02em; }
.p-label .num { color: var(--haze); font-variant-numeric: tabular-nums; }
.p-label .disc { color: var(--haze); font-size: 14px; max-width: 22ch; }
.p-title { grid-column: 4 / 13; display: grid; gap: 28px; }
.p-title h1 { font-size: clamp(44px, 6.6vw, 104px); letter-spacing: -.055em; line-height: .92; max-width: 15ch; }
.p-title .sum { font-size: clamp(18px, 1.6vw, 22px); line-height: 1.45; max-width: 46ch; }

/* Sélecteur Essentiel / En profondeur */
.modes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.seg { display: inline-flex; padding: 4px; border: 1px solid var(--rule); border-radius: 999px; position: relative; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 9px 18px; border-radius: 999px; font-size: 14px; color: var(--haze); cursor: pointer; transition: color .3s; }
.seg button[aria-pressed="true"] { color: var(--night); }
.seg .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--chalk); transition: translate .5s var(--out), width .5s var(--out); }
.modes .hint { font-size: 14px; color: var(--haze); }

/* Visuel principal */
.hero-vis { grid-column: 1 / -1; aspect-ratio: 16 / 8; border-radius: 18px; overflow: hidden; background: var(--slate); view-transition-name: projet-visuel; }
.hero-vis img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-vis.contain img { object-fit: contain; padding: 8%; }
.hero-vis.light { background: #fff; }

/* Fiche technique */
.fiche { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 24px var(--gap); margin: clamp(32px, 4vw, 56px) 0 0; padding-top: 24px; border-top: 1px solid var(--rule); }
.fiche div { display: grid; gap: 6px; align-content: start; }
.fiche dt { font-size: 13px; color: var(--haze); }
.fiche dd { margin: 0; font-size: 15px; line-height: 1.5; }

/* Sections */
.sec { padding-top: var(--section); }
.sec .s-label { grid-column: 1 / 4; padding-top: 8px; }
.sec .s-body { grid-column: 4 / 13; display: grid; gap: 28px; align-content: start; }
.sec h2 { font-size: clamp(32px, 4vw, 58px); letter-spacing: -.045em; line-height: 1.02; max-width: 20ch; }
.sec .lead { font-size: clamp(17px, 1.4vw, 20px); line-height: 1.6; max-width: 58ch; color: var(--bone); }
.sec .lead + .lead { margin-top: -8px; }
.deep[hidden] { display: none; }
.deep.enter { animation: rise .9s var(--out) both; }
@keyframes rise { from { opacity: 0; translate: 0 24px; } }

.bul { list-style: none; margin: 0; padding: 0; display: grid; max-width: 64ch; }
.bul li { padding: 16px 0 16px 28px; border-top: 1px solid var(--rule); position: relative; color: var(--bone); }
.bul li:last-child { border-bottom: 1px solid var(--rule); }
.bul li::before { content: ""; position: absolute; left: 2px; top: 27px; width: 8px; height: 8px; border-radius: 50%; background: var(--blush); }

.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.step { border-top: 1px solid var(--rule); padding-top: 20px; display: grid; gap: 10px; align-content: start; }
.step .n { font-family: var(--f-display); font-weight: 300; font-size: 22px; color: var(--haze); font-variant-numeric: tabular-nums; }
.step h3 { font-size: clamp(22px, 2vw, 28px); letter-spacing: -.03em; line-height: 1.15; }
.step p { color: var(--haze); max-width: 46ch; }

/* Galerie des réalisations */
.gallery { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: clamp(32px, 4vw, 56px); }
.gallery figure { margin: 0; display: grid; gap: 12px; align-content: start; }
.gallery .fr { border-radius: 14px; overflow: hidden; background: var(--slate); aspect-ratio: var(--ar, 4 / 3); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: scale .9s var(--out); }
.gallery .fr.contain img { object-fit: contain; padding: 8%; }
.gallery .fr.light { background: #fff; }
.gallery figure:hover img { scale: 1.02; }
.gallery figcaption { font-size: 13px; color: var(--haze); }
.gallery .w12 { grid-column: span 12; } .gallery .w7 { grid-column: span 7; } .gallery .w5 { grid-column: span 5; } .gallery .w6 { grid-column: span 6; } .gallery .w4 { grid-column: span 4; } .gallery .w8 { grid-column: span 8; }
.gallery .todo-fr { border: 1px dashed #4a4844; background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,.015) 14px 28px); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--haze); font-size: 14px; }

/* Ce dont je suis le plus fière */
.proud { margin-top: var(--section); padding-block: clamp(56px, 7vw, 112px); border-radius: 24px; background: radial-gradient(80% 120% at 85% 0%, rgba(231,185,182,.16), transparent 60%), var(--slate); }
.proud .s-label { grid-column: 2 / 4; }
.proud .s-body { grid-column: 4 / 12; }
.proud .slabel { color: var(--blush); }
.proud h2 { font-size: clamp(32px, 4.4vw, 64px); letter-spacing: -.045em; line-height: 1.02; max-width: 18ch; }
.proud .lead { color: var(--chalk); }

/* À compléter (visible dans le prototype uniquement) */
.todo { display: inline-block; font-size: 13px; line-height: 1.4; color: var(--blush); border: 1px dashed rgba(231,185,182,.5); border-radius: 8px; padding: 4px 10px; }
.note { font-size: 13px; color: var(--haze); font-style: italic; }

/* Invitation à la lecture en profondeur */
.more { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--f-display); font-size: clamp(20px, 1.8vw, 26px); font-weight: 300; letter-spacing: -.02em; color: var(--chalk); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 6px; transition: text-decoration-color .3s; }
.more:hover { text-decoration-color: var(--blush); }

/* Fin de page */
.end { padding-top: var(--section); }
.end .s-body { grid-column: 4 / 13; display: grid; gap: 28px; }
.end h2 { font-size: clamp(40px, 5.6vw, 84px); letter-spacing: -.055em; line-height: .95; max-width: 14ch; }
.end .row { display: flex; flex-wrap: wrap; gap: 12px; }
/* Projet suivant : grand visuel + fiche résumée */
.next { grid-column: 1 / -1; margin-top: var(--section); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 24px; text-decoration: none; border-top: 1px solid var(--rule); padding-top: 24px; }
.next > * { min-width: 0; }
.next .top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 14px; color: var(--haze); }
.next .top b { font-family: var(--f-display); font-weight: 300; font-size: 22px; letter-spacing: -.02em; color: var(--chalk); }
.next .top .count { font-variant-numeric: tabular-nums; }
.next .fr { grid-column: 1 / -1; position: relative; aspect-ratio: 21 / 9; border-radius: 18px; overflow: hidden; background: var(--slate); }
.next .fr img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.82) saturate(.9); transition: filter .6s, scale 1.2s var(--out); }
.next .fr.contain img { object-fit: contain; padding: 5%; }
.next .fr.light { background: #fff; }
.next .fr.light img, .next .fr.contain img { filter: none; }
.next:hover .fr img, .next:focus-visible .fr img { filter: none; scale: 1.035; }
.next .fr .go { position: absolute; right: clamp(16px, 2vw, 28px); bottom: clamp(16px, 2vw, 28px); display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px; background: var(--chalk); color: var(--night); font-size: 14px; translate: 0 8px; opacity: 0; transition: translate .6s var(--out), opacity .4s; }
.next:hover .go, .next:focus-visible .go { translate: 0 0; opacity: 1; }
.next .who { grid-column: 1 / 4; display: grid; gap: 4px; align-content: start; padding-top: 8px; }
.next .who .num { font-family: var(--f-display); font-weight: 300; font-size: 22px; color: var(--haze); font-variant-numeric: tabular-nums; }
.next .who span { font-size: 14px; color: var(--haze); }
.next .what { grid-column: 4 / 13; display: grid; gap: 14px; }
.next .what strong { font-family: var(--f-display); font-weight: 300; font-size: clamp(44px, 6vw, 92px); letter-spacing: -.055em; line-height: .95; }
.next .what strong .arrow { display: inline-block; font-size: .6em; vertical-align: .18em; color: var(--haze); transition: translate .6s var(--out), color .3s; }
.next:hover .what strong .arrow { translate: 12px 0; color: var(--blush); }
.next .what p { font-family: var(--f-display); font-weight: 300; font-size: clamp(20px, 1.8vw, 26px); letter-spacing: -.02em; line-height: 1.3; max-width: 34ch; color: var(--bone); }
.next .what .tags { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.next .what .tags span { font-size: 13px; color: var(--haze); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; }

.foot { padding-top: clamp(64px, 8vw, 120px); font-size: 13px; color: var(--haze); }
.foot > * { grid-column: span 6; } .foot > :last-child { text-align: right; }

/* Apparition à l'arrivée */
.in > * { animation: rise 1s var(--out) both; }
.in > *:nth-child(2) { animation-delay: .08s; } .in > *:nth-child(3) { animation-delay: .16s; } .in > *:nth-child(4) { animation-delay: .24s; }

@media (max-width: 900px) {
  .nav ul { display: none; }
  .nav .brand { grid-column: 1 / -1; }
  .p-label, .p-title, .sec .s-label, .sec .s-body, .proud .s-label, .proud .s-body, .end .s-body { grid-column: 1 / -1; }
  .proud { padding-inline: 20px; }
  .sec .s-label, .proud .s-label { padding: 0 0 16px; }
  .hero-vis { aspect-ratio: auto; } .hero-vis img { height: auto; } .hero-vis.contain img { aspect-ratio: 1; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .gallery > * { grid-column: 1 / -1 !important; }
  .next .who, .next .what { grid-column: 1 / -1; } .next .fr { aspect-ratio: 4 / 3; } .next .fr .go { translate: 0 0; opacity: 1; }
  .foot > * { grid-column: 1 / -1; text-align: left !important; }
}
@media (prefers-reduced-motion: reduce) {
  @view-transition { navigation: none; }
  .in > *, .deep.enter { animation: none; }
  .seg .pill, .mag, .mag .lbl, .gallery img, .next .fr img { transition: none; }
}
</style>
</head>

/* Rendu */
const fr = (g, cls = "") => g.todo
  ? `<div class="fr todo-fr" style="--ar:${g.ar || "4 / 3"}">${g.todo}<br><span class="todo" style="margin-top:8px">Visuel à fournir</span></div>`
  : `<div class="fr${g.contain ? " contain" : ""}${g.light ? " light" : ""}" style="--ar:${g.ar || "4 / 3"}"><img src="${A}${g.src}" alt="${g.alt}" loading="lazy"></div>`;
const gallery = list => `<div class="gallery">${list.map(g => `<figure class="w${g.w || 12}">${fr(g)}${g.cap ? `<figcaption>${g.cap}</figcaption>` : ""}</figure>`).join("")}</div>`;
const section = (s, deep) => `
  <section class="c sec${deep ? " deep" : ""}"${deep ? " data-deep" : ""} aria-label="${s.label}">
    <div class="s-label"><span class="slabel">${s.label}</span></div>
    <div class="s-body">
      <h2>${s.h}</h2>
      ${(s.p || []).map(t => `<p class="lead">${t}</p>`).join("")}
      ${s.list ? `<ul class="bul">${s.list.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
      ${s.steps ? `<div class="steps">${s.steps.map(([h, t], i) => `<div class="step"><span class="n">${String(i + 1).padStart(2, "0")}</span><h3>${h}</h3><p>${t}</p></div>`).join("")}</div>` : ""}
    </div>
    ${s.gallery ? gallery(s.gallery) : ""}
  </section>`;

const year = p => { const f = p.fiche.find(([k]) => k === "Année"); return f && !/todo/.test(f[1]) ? f[1] : ""; };

  const hv = p.hero;
  document.getElementById("page").innerHTML = `
  <header class="c p-head in">
    <a class="back" href="index.html#projets" data-home><span aria-hidden="true">←</span> Tous les projets</a>
    <div class="p-label"><span class="num">${p.n}</span><span class="disc">${p.disc}</span></div>
    <div class="p-title">

/* Mode de lecture : mémorisé, partageable avec ?lecture=profondeur */
const store = { get: () => { try { return localStorage.getItem("lecture"); } catch { return null; } }, set: v => { try { localStorage.setItem("lecture", v); } catch {} } };
let mode = new URLSearchParams(location.search).get("lecture") === "profondeur" ? "profondeur" : (store.get() || "essentiel");
function setMode(m, animate) {
  mode = m; store.set(m);
  const deep = m === "profondeur";
  document.querySelectorAll("[data-deep]").forEach(s => { s.hidden = !deep; s.classList.toggle("enter", deep && animate); });
  document.getElementById("invite").hidden = deep;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  document.getElementById("mode-hint").textContent = deep ? "Toute la démarche, étape par étape." : "L'essentiel en 1 minute.";
  const on = document.querySelector(`.seg button[data-mode="${m}"]`), pill = document.querySelector(".seg .pill");
  pill.style.width = on.offsetWidth + "px"; pill.style.translate = on.offsetLeft + "px 0";
}
function wire() {
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode, true)));
  document.getElementById("go-deep").addEventListener("click", () => { const y = scrollY; setMode("profondeur", true); scrollTo({ top: y }); document.querySelector("[data-deep]")?.scrollIntoView({ behavior: "smooth", block: "start" }); });
  setMode(mode, false);
  const btn = document.getElementById("end-cta"), lbl = btn.querySelector(".lbl"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  btn.addEventListener("pointermove", e => { const r = btn.getBoundingClientRect();
    btn.style.setProperty("--fx", `${e.clientX - r.left}px`); btn.style.setProperty("--fy", `${e.clientY - r.top}px`);
    if (reduce) return; const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    btn.style.translate = `${dx * .18}px ${dy * .3}px`; lbl.style.translate = `${dx * .08}px ${dy * .12}px`; });
  btn.addEventListener("pointerleave", () => { btn.style.translate = "0 0"; lbl.style.translate = "0 0"; });
}

/* Retour à l'accueil : l'adresse de l'accueil est notée au clic sur un projet */
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-home]"); if (!a) return;
  const hash = a.getAttribute("href").split("#")[1];
  let home = null;
  try { home = sessionStorage.getItem("home"); } catch {}
  if (!home) try { const ref = document.referrer && new URL(document.referrer); if (ref && ref.origin === location.origin && !/projet\.html/.test(ref.pathname)) home = ref.pathname + ref.search; } catch {}
  if (home) { e.preventDefault(); location.href = home + (hash ? "#" + hash : ""); }
});

const go = () => { const id = location.hash.slice(1); render(id); scrollTo({ top: 0 }); };
addEventListener("hashchange", () => document.startViewTransition ? document.startViewTransition(go) : go());
render(location.hash.slice(1));
</script>
